<script>
  function routeUser() {
    const IOS_URL = "https://apps.apple.com/in/app/bhima-e-gold/id6753930510";
    const ANDROID_URL = "https://1ve.in/MBHIMA/bWKQ7";
    const DESKTOP_URL = "https://1ve.in/MBHIMA/bWKQ7";

    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const urlParams = new URLSearchParams(window.location.search);
    const campaignSource = urlParams.get('ref') || 'direct'; // Capture ?ref= campaign tags

    let target = DESKTOP_URL;
    let eventName = "click-desktop";

    if (/android/i.test(ua)) {
      target = ANDROID_URL;
      eventName = "click-android";
    } else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
      target = IOS_URL;
      eventName = "click-ios";
    }

    // Pass custom event path, custom title, and campaign source to GoatCounter
    if (window.goatcounter && window.goatcounter.count) {
      window.goatcounter.count({
        path: eventName + "-" + campaignSource,
        title: "Redirect (" + eventName + ") via " + campaignSource,
        event: true
      });
    }

    setTimeout(function() {
      window.location.replace(target);
    }, 150);
  }

  window.addEventListener("DOMContentLoaded", routeUser);
</script>
